name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: |
          unzip -q OskolkiBezDny_Android_Project.zip -d project
          gradle -p project/OskolkiBezDny_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OskolkiBezDny-APK
          path: project/OskolkiBezDny_Android/app/build/outputs/apk/debug/*.apk
